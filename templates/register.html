<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body style="margin:0; font-family:Arial; background: linear-gradient(to right, #43e97b, #38f9d7);">

    <div style="width:380px; margin:50px auto; background:white; padding:30px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.2);">

        <h2 style="text-align:center; margin-bottom:20px; color:#333;">Create Account</h2>

        <form method="POST" action="/register">

            <input type="text" name="username" placeholder="Username"
                   style="width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc;">

            <input type="password" name="password" placeholder="Password"
                   style="width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc;">

            <input type="text" name="name" placeholder="Full Name"
                   style="width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc;">

            <input type="date" name="dob"
                   style="width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc;">

            <input type="text" name="phone" placeholder="Phone Number"
                   style="width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc;">

            <input type="email" name="email" placeholder="Email"
                   style="width:100%; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #ccc;">

            <button type="submit"
                    style="width:100%; padding:12px; background:#43e97b; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer;">
                Register
            </button>

        </form>

        <p style="text-align:center; margin-top:15px;">
            <a href="/login" style="text-decoration:none; color:#43e97b;">
                Already have an account? Login
            </a>
        </p>

    </div>

</body>
</html>
