<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body style="margin:0; font-family:Arial; background: linear-gradient(to right, #4facfe, #00f2fe);">

    <div style="width:350px; margin:80px auto; background:white; padding:30px; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.2);">

        <h2 style="text-align:center; margin-bottom:20px; color:#333;">Login</h2>

        <form method="POST" action="/login">

            <input type="text" name="username" placeholder="Username"
                   style="width:100%; padding:12px; margin:10px 0; border-radius:6px; border:1px solid #ccc;">

            <input type="password" name="password" placeholder="Password"
                   style="width:100%; padding:12px; margin:10px 0; border-radius:6px; border:1px solid #ccc;">

            <button type="submit"
                    style="width:100%; padding:12px; background:#4facfe; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer;">
                Login
            </button>

        </form>

        <p style="text-align:center; margin-top:15px;">
            <a href="/register" style="text-decoration:none; color:#4facfe;">
                Create Account
            </a>
        </p>

    </div>

</body>
</html>
